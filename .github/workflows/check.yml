name: checks

on:
  push:
  pull_request:

jobs:
  docs-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Docs references, sections and anchors
        run: python3 scripts/check-docs.py

      - name: Python syntax (scripts + templates)
        run: python3 -m py_compile scripts/*.py templates/*.py

      - name: Shell syntax
        run: bash -n scripts/*.sh
